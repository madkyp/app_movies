[package]
name = "app"
version = "0.1.0"
description = "TheFoundry:StreamDeck - Personal Media Streaming App"
authors = []
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "deflate"], default-features = false }
scraper = "0.20"
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1.3"
anyhow = "1"

# Torrent streaming
librqbit = { version = "8", default-features = false, features = ["rust-tls"] }
url = "2"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
dirs-next = "2"
futures = "0.3"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
